      "source": {"sheet": "Сводная матрица", "cell": "I10"},
      "note": "Западная музыка 2020-х."
    },
    {
      "id": "games-2022-1",
      "category": "games",
      "era": "2022-2026",
      "prompt": "PS5, Steam Deck, Atomic Heart, «Смута»",
      "quote": "PS5, Steam Deck: Atomic Heart (2023), Смута, Baldur’s Gate 3, Elden Ring, Black Myth: Wukong.",
      "source": {"sheet": "Сводная матрица", "cell": "K10"},

    },
    {

      "quote": "Baldur’s Gate 3, Elden Ring, Black Myth: Wukong.",
      "source": {"sheet": "Сводная матрица", "cell": "K10"},
      "note": "Мировые хиты 2020-х."
    },
    {

      "era": "2022-2026",
      "prompt": "СВО, санкции, перестройка экономики на ОПК, расширение БРИКС",
      "quote": "СВО (2022), санкции, перестройка экономики на ОПК, импортозамещение, расширение БРИКС, курс на суверенитет.",
      "source": {"sheet": "Сводная матрица", "cell": "F10"},
      "note": "Политика и экономика 2020-х."
    },
    {
      "id": "russia-2022-2",
      "category": "russia",
      "era": "2022-2026",
      "prompt": "Дипфейки, дропперы, трансграничные аферы и спад ИТ-хищений",
      "quote": "Трансграничные аферы (до 40% дел), дипфейки, дропперы, диверсии; с 2026 г. — спад ИТ-хищений (-31,5%) из-за антифрода.",
      "source": {"sheet": "Сводная матрица", "cell": "G10"},
      "note": "Криминал 2020-х."
    }
  ]
}
</script>

<script>
(function () {
  'use strict';

  var DATA = JSON.parse(document.getElementById('quiz-data').textContent);
  var ERAS = DATA.eras;
  var CATEGORIES = DATA.categories;
  var QUESTIONS = DATA.questions;
  var ERA_BY_ID = {};
  var CATEGORY_BY_ID = {};
  var ERA_ORDER = {};
  var CATEGORY_COLORS = {
    mixed: '#5eead4',
    tech: '#5eead4',
    cinema: '#fbbf24',
    music: '#f472b6',
    games: '#a3e635',
    russia: '#60a5fa'
  };
  var MODE_LABELS = { mixed: 'Все темы' };
  var BEST_KEY = 'ugadai-epohu:best:v1';
  var ROUND_SIZE = 10;
  var MAX_PER_ERA = 2;
  var app = document.getElementById('app');
  var i;

  for (i = 0; i < ERAS.length; i += 1) {
    ERA_BY_ID[ERAS[i].id] = ERAS[i];
    ERA_ORDER[ERAS[i].id] = i;
  }
  for (i = 0; i < CATEGORIES.length; i += 1) {
    CATEGORY_BY_ID[CATEGORIES[i].id] = CATEGORIES[i];
    MODE_LABELS[CATEGORIES[i].id] = CATEGORIES[i].label;
  }

  var searchParams = new URLSearchParams(window.location.search);
  var seed = searchParams.get('seed');
  var random = seed === null ? Math.random : mulberry32(Number(seed) || 1);

  var state = {
    screen: 'start',
    mode: 'mixed',
    deck: [],
    options: [],
    index: 0,
    score: 0,
    selected: null,
    locked: false,
    best: loadBest(),
    isRecord: false
  };

  function mulberry32(seedValue) {
    var value = seedValue;
    return function () {
      value |= 0;
      value = value + 0x6D2B79F5 | 0;
      var t = Math.imul(value ^ value >>> 15, 1 | value);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, function (character) {
      return {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[character];
    });
  }

  function shuffle(items) {
    var copy = items.slice();
    var index;
    var swap;
    for (index = copy.length - 1; index > 0; index -= 1) {
      swap = Math.floor(random() * (index + 1));
      var temporary = copy[index];
      copy[index] = copy[swap];
      copy[swap] = temporary;
    }
    return copy;
  }

  function loadBest() {
    try {
      var raw = window.localStorage.getItem(BEST_KEY);
      if (!raw) return {};
      var parsed = JSON.parse(raw);
      return parsed && typeof parsed === 'object' ? parsed : {};
    } catch (error) {
      return {};
    }
  }

  function saveBest(best) {
    try {
      window.localStorage.setItem(BEST_KEY, JSON.stringify(best));
    } catch (error) {
      return;
    }
  }

  function bestFor(mode) {
    var value = state.best[mode];
    return typeof value === 'number' ? value + '/10' : '—';
  }

  function pickDeck(mode) {
    var picked = [];
    var eraCounts = {};
    var pool;
    var index;
    var question;
    var eraCount;

    if (mode === 'mixed') {
      var byCategory = {};
      for (index = 0; index < CATEGORIES.length; index += 1) {
        byCategory[CATEGORIES[index].id] = shuffle(QUESTIONS.filter(function (item) {
          return item.category === CATEGORIES[index].id;
        }));
      }
      var categoryOrder = shuffle(CATEGORIES.map(function (category) {
        return category.id;
      }));
      for (index = 0; index < categoryOrder.length; index += 1) {
        var categoryId = categoryOrder[index];
        var taken = 0;
        for (var questionIndex = 0; questionIndex < byCategory[categoryId].length; questionIndex += 1) {
          if (taken >= 2) break;
          question = byCategory[categoryId][questionIndex];
          eraCount = eraCounts[question.era] || 0;
          if (eraCount >= MAX_PER_ERA) continue;
          picked.push(question);
          eraCounts[question.era] = eraCount + 1;
          taken += 1;
        }
        if (taken < 2) {
          for (var backupIndex = 0; backupIndex < byCategory[categoryId].length; backupIndex += 1) {
            if (taken >= 2) break;
            question = byCategory[categoryId][backupIndex];
            if (picked.indexOf(question) !== -1) continue;
            picked.push(question);
            eraCounts[question.era] = (eraCounts[question.era] || 0) + 1;
            taken += 1;
          }
        }
      }
      return shuffle(picked);
    }

    pool = shuffle(QUESTIONS.filter(function (item) {
      return item.category === mode;
    }));
    for (index = 0; index < pool.length; index += 1) {
      question = pool[index];
      eraCount = eraCounts[question.era] || 0;
      if (eraCount >= MAX_PER_ERA) continue;
      picked.push(question);
      eraCounts[question.era] = eraCount + 1;
      if (picked.length === ROUND_SIZE) break;
    }
    if (picked.length < ROUND_SIZE) {
      for (index = 0; index < pool.length; index += 1) {
        if (picked.indexOf(pool[index]) === -1) picked.push(pool[index]);
        if (picked.length === ROUND_SIZE) break;
      }
    }
    return shuffle(picked);
  }

  function buildOptions(correctEra) {
    var pool = [];
    var index;
    for (index = 0; index < ERAS.length; index += 1) {
      if (ERAS[index].id !== correctEra) pool.push(ERAS[index]);
    }
    pool = shuffle(pool).slice(0, 3);
    pool.push(ERA_BY_ID[correctEra]);
    pool.sort(function (left, right) {
      return ERA_ORDER[left.id] - ERA_ORDER[right.id];
    });
    return pool;
  }

  function haptic() {
    try {
      var webApp = window.Telegram && window.Telegram.WebApp;
      if (webApp && webApp.HapticFeedback && typeof webApp.HapticFeedback.impactOccurred === 'function') {
        webApp.HapticFeedback.impactOccurred('light');
      }
    } catch (error) {
      return;
    }
  }

  function scrollTop() {
    try {
      window.scrollTo(0, 0);
    } catch (error) {
      return;
    }
  }

  function scrollFeedbackIntoView() {
    var feedback = document.querySelector('[data-testid="feedback"]');
    if (!feedback) return;
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    try {
      feedback.scrollIntoView({ block: 'nearest', behavior: reduce ? 'auto' : 'smooth' });
    } catch (error) {
      feedback.scrollIntoView();
    }
  }

  function focusPrompt() {
    var prompt = document.querySelector('[data-testid="prompt"]');
    if (!prompt) return;
    try {
      prompt.focus({ preventScroll: true });
    } catch (error) {
      prompt.focus();
    }
  }

  function focusNext() {
    var nextButton = document.querySelector('[data-testid="next"]');
    if (!nextButton) return;
    try {
      nextButton.focus({ preventScroll: true });
    } catch (error) {
      nextButton.focus();
    }
  }

  function modeChips() {
    var modes = [{ id: 'mixed', label: MODE_LABELS.mixed, color: CATEGORY_COLORS.mixed }];
    for (i = 0; i < CATEGORIES.length; i += 1) {
      modes.push({
        id: CATEGORIES[i].id,
        label: CATEGORIES[i].label,
        color: CATEGORY_COLORS[CATEGORIES[i].id]
      });
    }
    return modes.map(function (mode) {
      var active = state.mode === mode.id;
      return '<button type="button" class="chip' + (active ? ' is-active' : '') + '" data-mode="' + mode.id + '" aria-pressed="' + (active ? 'true' : 'false') + '" style="--accent:' + mode.color + '"><span class="dot"></span>' + escapeHtml(mode.label) + '</button>';
    }).join('');
  }

  function optionHtml(era, question, optionIndex) {
    var isCorrect = era.id === question.era;
    var isSelected = era.id === state.selected;
    var classes = 'option';
    var mark = '';

    if (state.locked) {
      if (isCorrect) {
        classes += ' is-correct';
        mark = '<span class="option-mark" aria-hidden="true">✓</span>';
      } else if (isSelected) {
        classes += ' is-wrong';
        mark = '<span class="option-mark" aria-hidden="true">✕</span>';
      }
    }

    return '<button type="button" class="' + classes + '" data-testid="option" data-era="' + era.id + '" data-correct="' + (isCorrect ? 'true' : 'false') + '"' + (state.locked ? ' disabled' : '') + ' aria-label="Эпоха ' + escapeHtml(era.label) + '">' +
      '<span class="option-key" aria-hidden="true">' + (optionIndex + 1) + '</span>' +
      '<span class="option-year">' + escapeHtml(era.label) + '</span>' +
      mark +
      '</button>';
  }

  function feedbackHtml(question, isCorrect) {
    var nextLabel = state.index >= state.deck.length - 1 ? 'Результат' : 'Далее';
    return '<div class="feedback ' + (isCorrect ? 'ok' : 'bad') + '" data-testid="feedback" data-result="' + (isCorrect ? 'correct' : 'wrong') + '" role="status" aria-live="polite">' +
      '<div class="feedback-head"><span class="feedback-icon" aria-hidden="true">' + (isCorrect ? '✓' : '✕') + '</span><strong>' + (isCorrect ? 'Верно!' : 'Не эта эпоха') + '</strong></div>' +
      '<p><b>' + escapeHtml(ERA_BY_ID[question.era].label) + '</b> · ' + escapeHtml(question.note) + '</p>' +
      '<button class="next" type="button" data-testid="next">' + nextLabel + ' <span aria-hidden="true">→</span></button>' +
      '</div>';
  }

  function renderStart() {
    var best = bestFor(state.mode);
    app.innerHTML =
      '<header class="topbar">' +
        '<div class="brand"><span class="brand-icon" aria-hidden="true">⏳</span><span>Угадай эпоху!</span></div>' +
        '<div class="best-pill">Лучший <b data-testid="best-start">' + escapeHtml(best) + '</b></div>' +
      '</header>' +
      '<main class="start">' +
        '<div class="hero">' +
          '<p class="kicker">1980–2026 · 5 тем · 6 эпох</p>' +
          '<h1>Угадай<br><span class="grad">эпоху!</span></h1>' +
          '<p class="lead">Технологии, кино, музыка, игры и события России. 10 вопросов, 4 варианта — и пояснение после каждого ответа.</p>' +
        '</div>' +
        '<div class="timeline" aria-hidden="true"><span>1980</span><span>1990</span><span>2000</span><span>2007</span><span>2012</span><span>2022</span></div>' +
        '<div class="modes" role="group" aria-label="Выберите тему">' + modeChips() + '</div>' +
        '<button class="btn" type="button" data-testid="start">Начать <span aria-hidden="true">→</span></button>' +
        '<p class="hint">10 вопросов · без регистрации · работает в Telegram</p>' +
      '</main>' +
      '<footer class="foot">По мотивам «Энциклопедии эпох» 1980–2026</footer>';
  }

  function renderQuestion() {
    var question = state.deck[state.index];
    if (!question) {
      state.screen = 'start';
      renderStart();
      return;
    }
    var category = CATEGORY_BY_ID[question.category];
    var options = state.options.length ? state.options : buildOptions(question.era);
    var feedback = state.locked ? feedbackHtml(question, state.selected === question.era) : '';

    app.innerHTML =
      '<header class="topbar">' +
        '<div class="brand"><span class="brand-icon" aria-hidden="true">⏳</span><span>Угадай эпоху!</span></div>' +
        '<div class="score-pill">Счёт <b data-testid="score-value">' + state.score + '</b></div>' +
      '</header>' +
      '<main class="game" data-testid="question" data-category="' + question.category + '" data-era="' + question.era + '">' +
        '<div class="game-head">' +
          '<span class="qcount" data-testid="progress-text">Вопрос ' + (state.index + 1) + ' / ' + state.deck.length + '</span>' +
        '</div>' +
        '<div class="progress" role="progressbar" aria-label="Прогресс" aria-valuemin="1" aria-valuemax="' + state.deck.length + '" aria-valuenow="' + (state.index + 1) + '" data-testid="progress"><span style="width:' + ((state.index + 1) / state.deck.length * 100) + '%"></span></div>' +
        '<section class="question">' +
          '<span class="cat-chip" style="--accent:' + CATEGORY_COLORS[question.category] + '"><span class="dot"></span>' + escapeHtml(category.label) + '</span>' +
          '<h2 class="prompt" data-testid="prompt" tabindex="-1">' + escapeHtml(question.prompt) + '</h2>' +
          '<p class="qsub">К какой эпохе это относится?</p>' +
          '<div class="options">' + options.map(function (era, optionIndex) { return optionHtml(era, question, optionIndex); }).join('') + '</div>' +
          feedback +
        '</section>' +
      '</main>' +
      '<footer class="foot">Выберите один вариант — после ответа появится пояснение.</footer>';
  }

  function tierFor(score) {
    if (score === 10) return { title: 'Машина времени', note: 'Идеально: все эпохи на месте.' };
    if (score >= 8) return { title: 'Знаток эпох', note: 'Почти без промахов.' };
    if (score >= 6) return { title: 'Уверенный современник', note: 'Хорошая ориентация во времени.' };
    if (score >= 4) return { title: 'Турист во времени', note: 'Есть что вспомнить.' };
    return { title: 'Путешественник без карты', note: 'Эпохи ещё можно наверстать.' };
  }

  function buildShare(score) {
    if (!/^https?:$/.test(window.location.protocol)) return null;
    var base = window.location.origin + window.location.pathname;
    var modeText = state.mode === 'mixed' ? '' : ' Тема: «' + MODE_LABELS[state.mode] + '».';
    var text = 'Мой результат в «Угадай эпоху!»: ' + score + '/10.' + modeText + ' А ты?';
    return 'https://t.me/share/url?url=' + encodeURIComponent(base) + '&text=' + encodeURIComponent(text);
  }

  function renderResult() {
    var tier = tierFor(state.score);
    var best = bestFor(state.mode);
    var modeLabel = MODE_LABELS[state.mode];
    var share = buildShare(state.score);
    var bestLine = best === '—' ? 'Это твой первый результат' : 'Лучший результат: <b>' + escapeHtml(best) + '</b>';

    app.innerHTML =
      '<header class="topbar">' +
        '<div class="brand"><span class="brand-icon" aria-hidden="true">⏳</span><span>Угадай эпоху!</span></div>' +
        '<div class="best-pill">Лучший <b>' + escapeHtml(best) + '</b></div>' +
      '</header>' +
      '<main class="result" data-testid="result">' +
        '<p class="kicker">' + escapeHtml(modeLabel) + ' · результат</p>' +
        '<div class="score-big"><span data-testid="score">' + state.score + '</span><small>/10</small></div>' +
        '<h2 data-testid="tier">' + escapeHtml(tier.title) + '</h2>' +
        '<p class="result-note">' + escapeHtml(tier.note) + '</p>' +
        (state.isRecord && state.score > 0 ? '<div class="record">Новый рекорд!</div>' : '') +
        '<div class="best-line">' + bestLine + '</div>' +
        '<div class="actions">' +
          (share ? '<a class="btn" data-testid="share" href="' + escapeHtml(share) + '" target="_blank" rel="noopener noreferrer">Поделиться <span aria-hidden="true">↗</span></a>' : '') +
          '<button class="btn secondary" type="button" data-testid="restart">Ещё раз</button>' +
          '<button class="btn ghost" type="button" data-testid="change-mode">Сменить тему</button>' +
        '</div>' +
      '</main>' +
      '<footer class="foot">Спасибо за игру. Эпохи не заканчиваются.</footer>';
  }

  function render() {
    if (state.screen === 'start') {
      renderStart();
    } else if (state.screen === 'question') {
      renderQuestion();
    } else {
      renderResult();
    }
  }

  function startGame() {
    state.deck = pickDeck(state.mode);
    state.options = buildOptions(state.deck[0].era);
    state.index = 0;
    state.score = 0;
    state.selected = null;
    state.locked = false;
    state.isRecord = false;
    state.screen = 'question';
    renderQuestion();
    scrollTop();
    focusPrompt();
  }

  function answer(eraId) {
    if (state.locked || state.screen !== 'question') return;
    var question = state.deck[state.index];
    if (!question) return;
    state.locked = true;
    state.selected = eraId;
    if (eraId === question.era) state.score += 1;
    haptic();
    renderQuestion();
    scrollFeedbackIntoView();
    focusNext();
  }

  function nextQuestion() {
    if (!state.locked) return;
    if (state.index >= state.deck.length - 1) {
      finishRound();
      return;
    }
    state.index += 1;
    state.options = buildOptions(state.deck[state.index].era);
    state.locked = false;
    state.selected = null;
    renderQuestion();
    scrollTop();
    focusPrompt();
  }

  function finishRound() {
    var previous = typeof state.best[state.mode] === 'number' ? state.best[state.mode] : -1;
    state.isRecord = state.score > previous && state.score > 0;
    if (state.score > previous) {
      state.best[state.mode] = state.score;
      saveBest(state.best);
    }
    state.screen = 'result';
    renderResult();
    scrollTop();
  }

  function setMode(mode) {
    if (!MODE_LABELS[mode]) return;
    state.mode = mode;
    state.screen = 'start';
    renderStart();
    scrollTop();
  }

  function goToStart() {
    state.screen = 'start';
    renderStart();
    scrollTop();
  }

  app.addEventListener('click', function (event) {
    var target = event.target;
    if (!target || !target.closest) return;

    var modeButton = target.closest('[data-mode]');
    if (modeButton && state.screen === 'start') {
      setMode(modeButton.getAttribute('data-mode'));
      return;
    }

    var startButton = target.closest('[data-testid="start"]');
    if (startButton) {
      startGame();
      return;
    }

    var option = target.closest('[data-testid="option"]');
    if (option) {
      answer(option.getAttribute('data-era'));
      return;
    }

    var nextButton = target.closest('[data-testid="next"]');
    if (nextButton) {
      nextQuestion();
      return;
    }

    var restart = target.closest('[data-testid="restart"]');
    if (restart) {
      startGame();
      return;
    }

    var changeMode = target.closest('[data-testid="change-mode"]');
    if (changeMode) {
      goToStart();
    }
  });

  document.addEventListener('keydown', function (event) {
    if (state.screen !== 'question') return;

    if (!state.locked && /^[1-4]$/.test(event.key)) {
      var options = app.querySelectorAll('[data-testid="option"]');
      var option = options[Number(event.key) - 1];
      if (option) {
        event.preventDefault();
        option.click();
      }
      return;
    }

    if (state.locked && (event.key === 'Enter' || event.key === ' ')) {
      var nextButton = app.querySelector('[data-testid="next"]');
      if (nextButton) {
        event.preventDefault();
        nextButton.click();
      }
    }
  });

  try {
    var webApp = window.Telegram && window.Telegram.WebApp;
    if (webApp) {
      if (typeof webApp.ready === 'function') webApp.ready();
      if (typeof webApp.expand === 'function') webApp.expand();
    }
  } catch (error) {
    void error;
  }

  render();
})();
</script>
